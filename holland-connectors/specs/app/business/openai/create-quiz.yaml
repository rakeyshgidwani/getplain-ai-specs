openapi: 3.0.0
info:
  title: OpenAI Business Logic
  version: 1.0.0
paths:
  /create-quiz:
    post:
      operationId: create-quiz
      summary: Generates a quiz
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - topic
              properties:
                topic:
                  type: string
                  description: The topic of the quiz
                count:
                  type: integer
                  default: 5
                  description: Number of questions
                difficulty:
                  type: string
                  enum:
                    - easy
                    - medium
                    - hard
                  description: Difficulty level
      responses:
        '200':
          description: Quiz created
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - title
                properties:
                  id:
                    type: string
                  title:
                    type: string
